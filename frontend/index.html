<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <span class="brand">Student Management</span>
        <a href="index.html" class="active">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="add_student.html">Add Student</a>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Dashboard</h1>
            <a href="add_student.html" class="btn">+ Add Student</a>
        </div>

        <div class="stats">
            <div class="card">
                <div class="stat-label">Total students</div>
                <div class="stat-value" id="total-students">-</div>
            </div>
            <div class="card">
                <div class="stat-label">Courses</div>
                <div class="stat-value" id="total-courses">-</div>
            </div>
            <div class="card">
                <div class="stat-label">Average age</div>
                <div class="stat-value" id="average-age">-</div>
            </div>
        </div>

        <div class="card">
            <h2>Students per course</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Students</th>
                        </tr>
                    </thead>
                    <tbody id="course-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
