<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <span class="brand">Student Management</span>
        <a href="index.html">Dashboard</a>
        <a href="students.html" class="active">Students</a>
        <a href="add_student.html">Add Student</a>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Students</h1>
            <a href="add_student.html" class="btn">+ Add Student</a>
        </div>

        <input id="search" type="search" class="search-box" placeholder="Search by name or course..." aria-label="Search students">

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
